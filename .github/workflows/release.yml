name: Release Obsidian theme

on:
  push:
    tags:
      - "*"

# The default GITHUB_TOKEN is read-only in repositories whose Actions default
# is "Read repository contents", which makes `gh release create` fail with
# "HTTP 403: Resource not accessible by integration". Request write access to
# the repository contents explicitly so the release can be created.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Build theme.css
        run: |
          npm ci
          npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --generate-notes \
            --draft \
            manifest.json theme.css
